services:
  web:
    build: .
    image: expertcook:local
    ports:
      - "127.0.0.1:8000:8000"
    environment:
      PORT: "8000"
      PROPORTIONS_PATH: /data/proportions.json
      RULES_ADMIN_TOKEN: ${RULES_ADMIN_TOKEN:-}
    volumes:
      - rules:/data
    healthcheck:
      test: ["CMD", "python", "-c", "import urllib.request; urllib.request.urlopen('http://127.0.0.1:8000/healthz', timeout=5)"]
      interval: 15s
      timeout: 6s
      retries: 3
      start_period: 15s
    restart: unless-stopped
volumes:
  rules:
